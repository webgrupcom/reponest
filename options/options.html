<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoNest</title>
<style>
  :root { color-scheme: light dark; --fg:#1f2328; --muted:#59636e; --bg:#fff; --bg2:#f6f8fa; --border:#d1d9e0; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --muted:#9198a1; --bg:#0d1117; --bg2:#151b23; --border:#3d444d; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  header img { width:40px; height:40px; }
  h1 { font-size:22px; margin:0; }
  p { color:var(--muted); margin:0 0 16px; }
  table { width:100%; border-collapse:collapse; margin-bottom:12px; }
  th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:6px; }
  td { padding:4px 6px; border-top:1px solid var(--border); vertical-align:middle; }
  input[type=text] { width:100%; box-sizing:border-box; padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  input[type=color] { width:36px; height:28px; padding:0; border:1px solid var(--border); border-radius:6px; background:none; }
  button { padding:6px 14px; border:1px solid var(--border); border-radius:6px; background:var(--bg2); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:#1f883d; border-color:#1f883d; color:#fff; }
  .row-actions { white-space:nowrap; }
  .row-actions button { padding:3px 8px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .spacer { flex:1; }
  #msg { color:var(--muted); }
  @media (max-width:640px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<main>
  <header><img src="../icons/icon128.png" alt=""><h1 data-i18n="optTitle"></h1></header>
  <p data-i18n="optHelp"></p>
  <table>
    <thead><tr><th data-i18n="optColor"></th><th data-i18n="optFolder"></th><th data-i18n="optPrefixes"></th><th class="hide-sm" data-i18n="optTopics"></th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="bar">
    <button id="add" type="button" data-i18n="optAdd"></button>
    <button id="preset" type="button" data-i18n="optPreset"></button>
    <button id="auto" type="button" data-i18n="optAuto"></button>
    <span class="spacer"></span>
    <span id="msg"></span>
    <button id="save" class="primary" type="button" data-i18n="optSave"></button>
  </div>
</main>
<script src="../src/rules.js"></script>
<script src="options.js"></script>
</body>
</html>
